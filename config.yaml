# VMM night-sky race configuration
# Paths are relative to the repo, then DATA_DIR (~/Documents/data/vmm-stargazing).

race:
  name: "VMM 100 Miles 2026"
  location: "Sa Pa, Lào Cai, Vietnam"
  # Approximate start coordinates (Sapa Square); refined from GPX once available
  default_lat: 22.340
  default_lon: 103.844
  default_elev_m: 1550

# Course track
gpx: "gpx/vmm-100-miles-2026.gpx"
checkpoints: "checkpoints.csv"

pace:
  scenario: realistic
  max_climb_pace: 40.0
  base_pace: 8.01
  ele_penalty: 0.0322
  descent_benefit: 0.0113
  end_fatigue: 1.538
  calib_distance_km: 108.6
  scenarios:
    optimistic:
      terrain: 0.97
      fatigue_scale: 0.90
      extra_stoppage_h: 1.0
    realistic:
      terrain: 1.03
      fatigue_scale: 1.00
      extra_stoppage_h: 2.5
    conservative:
      terrain: 1.10
      fatigue_scale: 1.15
      extra_stoppage_h: 4.0

# Timing (local time, Asia/Ho_Chi_Minh = UTC+7)
timezone: "Asia/Ho_Chi_Minh"
start_time: "2026-09-18T08:00:00+07:00"
# Either cutoff_time or time_limit_hours (prefer both for clarity)
cutoff_time: "2026-09-20T09:00:00+07:00"
time_limit_hours: 49

# Sampling & visibility thresholds (used once code exists)
sampling:
  # Only sample during astronomical night windows
  distance_m: 2000          # along-track spacing for sky snapshots
  max_points_per_night: 24

spots:
  min_gap_km: 4.0
  max_per_night: 8
  score_floor: 0.7

visibility:
  planet_mag_limit: 6.0     # fainter planets ignored
  include_moon: true
  include_milky_way_note: true
  # Simple horizon masking via DEM (degrees above geometric horizon)
  horizon_buffer_deg: 2.0

dem:
  source: "copernicus-glo30"  # same preference as gpx-dem-preview
  # cache lives under DATA_DIR/dem/
