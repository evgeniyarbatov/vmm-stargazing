[project]
name = "stargazing-ultras"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dem-stitcher",
    "gpxpy",
    "numpy",
    "pyyaml",
    "rasterio",
    "skyfield",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "S101", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "dem_stitcher.*",
    "gpxpy.*",
    "rasterio.*",
    "skyfield.*",
    "jplephem.*",
    "yaml.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.5.5",
]
